
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ========================================= -->
    <!-- Basic Meta -->
    <!-- ========================================= -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- ========================================= -->
    <!-- Primary SEO -->
    <!-- ========================================= -->
    <title>Ethiraj College | Official Website</title>

    <meta
      name="title"
      content="Ethiraj College | Official Website"
    />

    <meta
      name="description"
      content="Ethiraj College for Women, Chennai – Autonomous institution offering undergraduate, postgraduate, and research programs in arts, science, commerce, management, and technology."
    />

    <meta
      name="keywords"
      content="Ethiraj College, Chennai Women's College, UG Programs, PG Programs, Arts and Science College, B.Com, B.Sc, MBA, MCA"
    />

    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index,follow"
    />

    <meta
      name="author"
      content="Ethiraj College"
    />

    <!-- ========================================= -->
    <!-- Canonical URL -->
    <!-- ========================================= -->
    <link
      rel="canonical"
      href="https://ethirajcollege.edu.in/"
    />

    <!-- ========================================= -->
    <!-- Theme -->
    <!-- ========================================= -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="msapplication-TileColor"
      content="#ffffff"
    />

    <!-- ========================================= -->
    <!-- Favicons -->
    <!-- ========================================= -->

    <!-- Main favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- PNG Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />

    <!-- Apple iPhone/iPad -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!-- Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/android-chrome-192x192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%PUBLIC_URL%/android-chrome-512x512.png"
    />

    <!-- ========================================= -->
    <!-- PWA Manifest -->
    <!-- ========================================= -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/site.webmanifest"
    />

    <!-- ========================================= -->
    <!-- Open Graph / Facebook -->
    <!-- ========================================= -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:site_name"
      content="Ethiraj College"
    />

    <meta
      property="og:title"
      content="Ethiraj College | Official Website"
    />

    <meta
      property="og:description"
      content="Ethiraj College for Women, Chennai – Autonomous institution offering undergraduate, postgraduate, and research programs."
    />

    <meta
      property="og:url"
      content="https://ethirajcollege.edu.in/"
    />

    <meta
      property="og:image"
      content="https://ethirajcollege.edu.in/social-share.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Ethiraj College"
    />

    <!-- ========================================= -->
    <!-- Twitter -->
    <!-- ========================================= -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ethiraj College | Official Website"
    />

    <meta
      name="twitter:description"
      content="Ethiraj College for Women, Chennai – Autonomous institution offering undergraduate, postgraduate, and research programs."
    />

    <meta
      name="twitter:image"
      content="https://ethirajcollege.edu.in/social-share.png"
    />

    <!-- ========================================= -->
    <!-- Structured Data -->
    <!-- ========================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollegeOrUniversity",
        "name": "Ethiraj College",
        "alternateName": "Ethiraj College for Women",
        "url": "https://ethirajcollege.edu.in/",
        "logo": "https://ethirajcollege.edu.in/logo.png",
        "description": "Ethiraj College for Women, Chennai – Autonomous institution offering undergraduate, postgraduate, and research programs.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "70, Ethiraj Salai",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600008",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- ========================================= -->
    <!-- Fonts Optimization -->
    <!-- ========================================= -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- ========================================= -->
    <!-- Google Site Verification -->
    <!-- ========================================= -->
    <!--
      Add this after verification:
      <meta
        name="google-site-verification"
        content="YOUR_VERIFICATION_CODE"
      />
    -->

  </head>

  <body>

    <!-- Skip Link -->
    <a
      href="#maincontent"
      style="
        position:absolute;
        left:-999px;
        top:auto;
        width:1px;
        height:1px;
        overflow:hidden;
      "
      onfocus="
        this.style.position='static';
        this.style.width='auto';
        this.style.height='auto';
      "
    >
      Skip to main content
    </a>

    <!-- React Root -->
    <div id="root"></div>

    <!-- No JavaScript -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

  </body>
</html>
